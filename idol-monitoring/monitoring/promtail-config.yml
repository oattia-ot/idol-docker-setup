server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Docker containers logs
  - job_name: docker
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker
          __path__: /var/lib/docker/containers/*/*-json.log
    
    pipeline_stages:
      - json:
          expressions:
            output: log
            stream: stream
            attrs: attrs
      
      - json:
          expressions:
            tag: attrs.tag
          source: attrs
      
      - regex:
          expression: (?P<container_name>(?:[^|]*[^|]))
          source: tag
      
      - timestamp:
          source: time
          format: RFC3339Nano
      
      - labels:
          container_name:
          stream:
      
      - output:
          source: output

  # IDOL specific logs (if you have log files mounted)
  - job_name: idol-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: idol
          __path__: /var/log/idol/**/*.log
    
    pipeline_stages:
      - regex:
          expression: '(?P<timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2})'
      
      - timestamp:
          source: timestamp
          format: '2006-01-02 15:04:05'
      
      - labels:
          job: