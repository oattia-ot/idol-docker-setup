// patching config file
// idol_ssl.cfg is written by run_idol.sh with SSL settings if required by IDOL_SSL env variable
// original.view.cfg is the config file as contained in the standard component zip

// modified config sections

< "idol_ssl.cfg" [SSLSettings]

[License] < "original.view.cfg" [License]
LicenseServerHost=licenseserver
SSLConfig=LicenseSSL

[LicenseSSL]
SSLMethod=Negotiate
SSLCACertificate=/ssl/certs/ca-chain.cert.pem
SSLCheckCertificate=False


[Service] < "original.view.cfg" [Service]
Access-Control-Allow-Origin=*
SSLConfig=SSLSettings

[Server] < "original.view.cfg" [Server]
< "idol_ssl.cfg" [EnableSSL] SSLConfig

[Viewing] < "original.view.cfg" [Viewing]
ViewLocalDirectoriesCSVs=/idol-ingest
IDOLHost=idol-agentstore
IDOLPort=9050
DistributedConnectorHost=idol-nifi
DistributedConnectorPort=11000
LegacyRendering=TRUE
< "idol_ssl.cfg" [EnableSSL] SSLConfig


[UniversalViewing]
// Enables the Universal Viewing feature, which allows IDOL to retrieve and
// display original documents directly from their source storage location.
// TRUE  — Document viewing is active; users can open/view original files.
// FALSE — Viewing is disabled; only metadata and snippets are returned.
Enabled=TRUE

// Hostname or IP address of the IDOL Content component that stores the
// document data used for viewing. In this case pointing to the
// 'idol-content' service (typically resolved via DNS or Docker/K8s service name).
DocumentStoreHost=idol-content

// ACI port of the DocumentStore (IDOL Content) used to retrieve documents
// for viewing. Must match the Port= value in the Content components config.
DocumentStorePort=9100

// Specifies which document field is used as the reference when documents
// are ingested via a Distributed Connector.
// DREREFERENCE   — Uses IDOLs standard unique document reference field (current).
// AUTN_IDENTIFIER — Was the original connector-assigned identifier (legacy, now commented out).
// Changed to DREREFERENCE to align references across all ingestion paths.
DistributedConnectorReferenceField=DREREFERENCE

// Specifies which field holds the document reference when ingested via a
// FileSystem Connector.
// DREREFERENCE     — Uses IDOLs standard reference field (current).
// ORIGINAL_LOCATION — Was the physical file path on disk (legacy, now commented out).
// Changed to DREREFERENCE for consistency with other connector reference fields.
FileSystemReferenceField=DREREFERENCE

// Tells Universal Viewing which document field contains the name of the
// Connector Group that originally ingested the document.
//
// When a user clicks "View Document", Universal Viewing reads this field
// to identify and route the request to the correct connector to fetch
// the original file from its source.
//
// How routing works:
//   1. User requests to view a document
//   2. Universal Viewing reads the CONNECTOR_GROUP field on the document
//   3. Identifies which Connector Group ingested it
//   4. Routes the view request to that Connector
//   5. Connector fetches the original file from the source system
//   6. Document is returned and displayed to the user
//
// The CONNECTOR_GROUP field is stamped onto every document at ingestion
// time by the connector. Example values stored in this field:
//
//   FileSystem documents  → CONNECTOR_GROUP = "FileSystemConnectorGroup"
//   SharePoint documents  → CONNECTOR_GROUP = "SharePointConnectorGroup"
//   Exchange emails       → CONNECTOR_GROUP = "ExchangeConnectorGroup"
//   Web pages             → CONNECTOR_GROUP = "WebConnectorGroup"
//
// Without this field correctly set, Universal Viewing cannot determine
// which connector to contact and all view requests will fail.
ConnectorGroupField=CONNECTOR_GROUP

// ----- New Entries -----

// Specifies the field used as the unique reference when retrieving a document
// from the DocumentStore (IDOL Content).
// Using DREREFERENCE ensures the viewing request can reliably locate the
// correct document in the content store.
DocumentStoreReferenceField=DREREFERENCE

// Specifies the field used to construct or resolve the web-accessible URL
// for viewing a document in a browser.
// Using DREREFERENCE means the documents IDOL reference doubles as its
// web URL identifier — suitable when documents are served via a web
// proxy or viewer that maps DREREFERENCE to a viewable URL.
WebURLField=DREREFERENCE



[SSLSection] < "original.view.cfg" [SSLSection]
SSLMethod=Negotiate

[AuthorizationRoles] < "original.view.cfg" [AuthorizationRoles]

[AdminRole] < "original.view.cfg" [AdminRole]
Clients=*

[QueryRole] < "original.view.cfg" [QueryRole]
Clients=*

[Logging] < "original.view.cfg" [Logging]
LogDirectory=/idol-logs
LogArchiveDirectory=/idol-logs/archive
LogEcho=TRUE

// unmodified config sections

[Paths] < "original.view.cfg" [Paths]
[ApplicationLogStream] < "original.view.cfg" [ApplicationLogStream]
[QueryLogStream] < "original.view.cfg" [QueryLogStream]
[CustomViewingErrors] < "original.view.cfg" [CustomViewingErrors]
