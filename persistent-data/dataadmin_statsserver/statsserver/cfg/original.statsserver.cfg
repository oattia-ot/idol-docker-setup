[License] < "idol.common.cfg" [License]

[Service]
ServicePort=19872
Access-Control-Allow-Origin=*
XSLTemplates=TRUE

[Server]
Port=19870
EventPort=19871

EventClients=localhost

Threads=4
MaxInputString=64000
XSLTemplates=TRUE

EventThreads=8
ActionEvent=TRUE

//--------------------------- Authorization Roles ----------------------------//
[AuthorizationRoles]
0=AdminRole
1=QueryRole

[AdminRole] < "idol.common.cfg" [AdminRole]

[QueryRole] < "idol.common.cfg" [QueryRole]
//----------------------------------------------------------------------------//

[Paths]
History=./history
Main=./main
TemplateDirectory=./templates

[statistics]
0=count_queries
1=count_terms
2=count_zerohits
3=count_promotions
4=topn_queries
5=topn_terms
6=topn_zerohits
7=topn_promotions
8=adaptiveranking
9=count_promotionsitems_day
10=topn_promotionitems_day
11=count_synonym_day
12=count_synonymuserquery_day
13=topn_synonyms_day
14=topn_synonymuserqueries_day
15=topn_users
16=avg_numterms
17=avg_duration
18=topn_resultspage
19=count_spellcheck
20=topn_spellcheck
21=count_parametric
22=topn_parametricfields
23=topn_parametricvalues_doctype
24=topn_parametricvalues_category

[count_queries]
operation=count
field=queryinfo/query
period=3600

[count_terms]
operation=count
field=queryinfo/terms/term
period=3600

[count_zerohits]
operation=count
field=queryinfo/query
NEqualStat=numhits,0
period=3600

[count_promotions]
operation=count
field=promotion
period=3600

[count_promotionsitems_day]
operation=count
field=promotionitem
period=86400

[count_synonym_day]
operation=count
field=Synonym
period=86400

[count_synonymuserquery_day]
operation=count
field=SynonymUserQuery
period=86400

[topn_queries]
operation=topn,100
field=queryinfo/query
period=3600

[topn_terms]
operation=topn,100
field=queryinfo/terms/term
period=3600

[topn_zerohits]
operation=topn,100
field=queryinfo/query
NEqualStat=numhits,0
period=3600

[topn_promotions]
operation=topn,100
field=promotion
period=3600

[topn_promotionitems_day]
operation=topn,100
field=promotionitem
period=86400

[adaptiveranking]
Operation=topn,100
Field=adaptiveranking/reference
period=3600

[topn_synonyms_day]
operation=topn,100
field=Synonym
period=86400

[topn_synonymuserqueries_day]
operation=topn,100
field=SynonymUserQuery
period=86400

[topn_users]
operation=topn,100
field=queryinfo/userID
period=3600

[avg_numterms]
operation=average
field=queryinfo/numterms
period=3600

[avg_duration]
operation=average
field=queryinfo/duration
period=3600

[topn_resultspage]
operation=topn,20
field=queryinfo/resultsPage
period=3600

[count_spellcheck]
operation=count
field=spellcheckinfo/query
period=3600

[topn_spellcheck]
operation=topn,100
field=spellcheckinfo/query
period=3600

[count_parametric]
operation=count
field=parametricinfo/query
period=3600

[topn_parametricfields]
operation=topn,100
field=parametricinfo/fields/field
period=3600

[topn_parametricvalues_doctype]
operation=topn,100
field=parametricinfo/doctype/values/value
period=3600

[topn_parametricvalues_category]
operation=topn,100
field=parametricinfo/category/values/value
period=3600

//--------------------------- Logging ----------------------------------------//
[Logging] < "idol.common.cfg" [Logging]

// Log streams
0=ApplicationLogStream
1=QueryLogStream
2=EventLogStream

[ApplicationLogStream] < "idol.common.cfg" [ApplicationLogStream]

[QueryLogStream] < "idol.common.cfg" [QueryLogStream]

[EventLogStream] < "idol.common.cfg" [EventLogStream]
