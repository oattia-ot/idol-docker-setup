// patching config file
// idol_ssl.cfg is written by run_idol.sh with SSL settings if required by IDOL_SSL env variable
// original.mediaserver.cfg is the config file as contained in the standard component zip

// modified config sections

< "idol_ssl.cfg" [SSLSettings]

[License] < "original.mediaserver.cfg" [License]
LicenseServerHost=licenseserver
SSLConfig=LicenseSSL

[LicenseSSL] < "original.mediaserver.cfg" [LicenseSSL]

[Service] < "original.mediaserver.cfg" [Service]
Access-Control-Allow-Origin=*
SSLConfig=SSLSettings

[Server] < "original.mediaserver.cfg" [Server]
< "idol_ssl.cfg" [EnableSSL] SSLConfig

[AuthorizationRoles] < "original.mediaserver.cfg" [AuthorizationRoles]

[AdminRole] < "original.mediaserver.cfg" [AdminRole]
Clients=*

[QueryRole] < "original.mediaserver.cfg" [QueryRole]
Clients=*

[Paths] < "original.mediaserver.cfg" [Paths]
AllowedEngineOutputDirectories=output,/processed-video
LanguagePackDirectory=/mediaserver/staticdata/speechtotext

[Resources] < "original.mediaserver.cfg" [Resources]
IDOLServer=idol-content:9100/Default

[Modules]
//Enable=facedetect,ocr,speechtotext
Enable=

[Channels]
VisualChannels=1
SurveillanceChannels=1
AudioChannels=1
VideoManagementChannels=1

[Logging] < "original.mediaserver.cfg" [Logging]
LogDirectory=/idol-logs
LogArchiveDirectory=/idol-logs/archive
LogEcho=TRUE

// unmodified config sections

[Actions] < "original.mediaserver.cfg" [Actions]
[Database] < "original.mediaserver.cfg" [Database]
[Process] < "original.mediaserver.cfg" [Process]
[APP_LOG_STREAM] < "original.mediaserver.cfg" [APP_LOG_STREAM]
[ACT_LOG_STREAM] < "original.mediaserver.cfg" [ACT_LOG_STREAM]
[ENGINE_LOG_STREAM] < "original.mediaserver.cfg" [ENGINE_LOG_STREAM]
[INGEST_LOG_STREAM] < "original.mediaserver.cfg" [INGEST_LOG_STREAM]
[AUDIO_ANALYSIS_LOG_STREAM] < "original.mediaserver.cfg" [AUDIO_ANALYSIS_LOG_STREAM]
