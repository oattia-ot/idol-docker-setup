[License] < "idol.common.cfg" [License]

[SERVICE]
SERVICEPORT=9183
SERVICECONTROLCLIENTS=127.0.0.1,10.2.*.*
SERVICESTATUSCLIENTS=127.0.0.1,10.2.*.*

[SERVER]
QUERYCLIENTS=*.*.*.*
INDEXCLIENTS=*.*.*.*
ADMINCLIENTS=*.*.*.*

QUERYPORT=9180
INDEXPORT=9181
PORT=9182

Threads=4
MaxInputString=1000000
MaxQueryTerms=5000

QUERYTHREADS=1
SplitNumbers=0
TermSize=20
DiskHash=5000000

AdvancedSearch=TRUE
AdvancedCaseSearch=TRUE
AgentBooleanCacheField=*/AGENTBOOL
// Used for queries with TextParse and FieldTextField (such as geoagentboolean lookups)
FieldTextCacheField=*/FTF
CombineIgnoreMissingValue=True
ParametricRefinement=True
ParametricNumericMapping=True

DateFormatCSVs=SHORTMONTH#SD+#SYYYY,DD/MM/YYYY,YYYY/MM/DD,YYYY-MM-DD,AUTNDATE
DEFAULTDOCUMENTFORMAT=IDX
IDXFIELDPREFIX=DOCUMENT
DOCUMENTDELIMITERCSVs=*/DOCUMENT

//--------------------------- Cache Settings ---------------------------------//
[IndexCache]
IndexCacheMaxSize=11000

//---------------------------Section breaking---------------------------------//
[SectionBreaking]
MinFieldLength=80000
MaxSectionLength=2000000

//---------------------------Paths-------------------------------------------//
[PATHS]
// This allows the database to be split across multiple partitions
DyntermPath=./dynterm
NodetablePath=./nodetable
RefIndexPath=./refindex
MainPath=./main
LogPath=./logs

//---------------------------Field Processing-------------------------------//
[FieldProcessing]
0=IndexFields
1=SectionBreakFields
2=DateFields
3=DatabaseFields
4=SetupReferenceFields
5=SourceFields
6=TitleFields
7=FieldCheckFields
8=AlwaysMatchFields
9=TextParseIndexFields
10=MatchFields
11=ParametricFields
12=NumericFields

[IndexFields]
// Controls which fields are indexed
Property=Index
PropertyFieldCSVs=*/DRECONTENT

[SectionBreakFields]
// Field containing document section number
Property=Section
PropertyFieldCSVs=*/DRESECTION

[DateFields]
// Fields containing the document date
Property=Date
PropertyFieldCSVs=*/DREDATE

[DatabaseFields]
// CSV of field names that defined the documents database
Property=Database
PropertyFieldCSVs=*/DREDBNAME

[SetupReferenceFields]
Property=ReferenceFields
PropertyFieldCSVs=*/DREREFERENCE

[SourceFields]
// SourceFields - used in suggest and for generating summaries
Property=Source
PropertyFieldCSVs=*/DRECONTENT

[TitleFields]
// Title Fields
Property=Title
PropertyFieldCSVs=*/DRETITLE

[FieldCheckFields]
// Used to combine results
Property=FieldCheck
PropertyFieldCSVs=*/CHECK

[AlwaysMatchFields]
// Used to ensure the AGENTBOOL field is always checked, regardless of the value of DRECONTENT
Property=AlwaysMatch
PropertyFieldCSVs=*/ALWAYSMATCH

[TextParseIndexFields]
// These fields are treated as index fields when Query is used with TextParse=True 
// and a percent-encoded doc as the input text.
// In practice, this is used for geoagentboolean lookups.
Property=TextParse
Propertyfieldcsvs=*/DRECONTENT,*/LAT,*/LON

[MatchFields]
Property=Match
PropertyFieldCSVs=*/DRETITLE

[ParametricFields]
Property=Parametric
PropertyFieldCSVs=*/PLACE_TYPE,*/PLACE_COUNTRY_CODE

[NumericFields]
Property=Numeric
PropertyFieldCSVs=*/PLACE_POPULATION

//---------------------------Properties-------------------------------//
[Index]
Index=TRUE

[Section]
SectionBreakType=TRUE

[Date]
DateType=TRUE

[Database]
DatabaseType=TRUE

[ReferenceFields]
ReferenceType=TRUE
TrimSpaces=TRUE

[Source]
SourceType=TRUE

[Title]
TitleType=TRUE

[FieldCheck]
FieldCheckType=TRUE

[AlwaysMatch]
AlwaysMatchType=true

[TextParse]
TextParseIndexType=true

[Match]
MatchType=True

[Parametric]
ParametricType=TRUE

[Numeric]
NumericType=TRUE

//---------------------------Databases-------------------------------//
[DATABASES]
NUMDBS=3
0=Companies
1=People
2=Places

//---------------------------Logging-------------------------------//
[Logging]
LogEcho=false
LogTime=true
LogHistorySize=50
MaxLogSizeKbs=20240
0=INDEX_LOG_STREAM
1=QUERY_LOG_STREAM
2=APP_LOG_STREAM

[INDEX_LOG_STREAM]
LogFile=index.log
LogTypeCSVs=index
LogLevel=normal
// oldlogfileaction defines how a logfile is treated after it reaches its maxlogsizekbs.
// other options are: consecutive and previous
oldlogfileaction=datestamp

[QUERY_LOG_STREAM]
LogFile=query.log
LogTypeCSVs=query
loglevel=normal
oldlogfileaction=previous

[APP_LOG_STREAM]
LogFile=application.log
LogTypeCSVs=application
loglevel=normal
oldlogfileaction=datestamp

//---------------------------Language types-------------------------------//
[LanguageTypes]
DefaultLanguageType=englishUTF8
LanguageDirectory=./langfiles

0=english

[english]
Encodings=ASCII:englishASCII,UTF8:englishUTF8
Stoplist=NONE
IndexNumbers=1
Propernames=0
SoftSeparators=&
HyphenChars=NONE
NgramOrientalOnly=true
AugmentSeparators=-'.’–‒—―
Stemming=false
TangibleCharacters=$@

