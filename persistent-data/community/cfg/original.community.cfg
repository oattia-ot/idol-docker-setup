[License] < "idol.common.cfg" [License]

[Service]
ServicePort=9032
Access-Control-Allow-Origin=*
XSLTemplates=TRUE

[Server]
# Port the server listens on for incoming client connections
Port=9030

# Controls when the server authenticates/logs in to its backend data source.
#
# DeferLogin=FALSE (default)
#   The server establishes and authenticates a backend connection
#   immediately at startup.
#
# DeferLogin=TRUE
#   The server delays backend login until the first actual client
#   request arrives.
#
# Why use DeferLogin=TRUE?
#   - Faster startup: The server process starts and is ready to accept
#     connections without waiting for backend authentication to complete.
#   - Resource efficiency: No backend connection is held open during
#     idle periods before any client connects.
#   - Resilience at boot: If the backend (e.g. database) isn't fully
#     ready when the server starts, deferred login avoids an immediate
#     startup failure.
#   - Connection pooling: Useful when connections should only be
#     established on-demand rather than eagerly.
# DeferLogin=TRUE

# Number of concurrent worker threads for handling client requests
Threads=4

# Maximum allowed size (in characters) for a single input string payload
MaxInputString=64000

# Enable XSL template processing for XML transformation support
XSLTemplates=TRUE

# Log the time taken to process each request for performance monitoring
LogRequestTiming=TRUE

//--------------------------- Authorization Roles ----------------------------//
[AuthorizationRoles]
0=AdminRole
1=QueryRole

[AdminRole] < "idol.common.cfg" [AdminRole]

[QueryRole] < "idol.common.cfg" [QueryRole]
//----------------------------------------------------------------------------//

[DataDre]
// The content engine
host=localhost
aciport=9100
// Default is 10 attempts
DREStartupRetries=360
// Default is 5 seconds
DREStartupTimeout=10

[AgentDre]
// The agentstore
host=localhost
aciport=9050
// Default is 10 attempts
DREStartupRetries=360
// Default is 5 seconds
DREStartupTimeout=10

//--------------------------- Paths ------------------------------------------//
[Paths]
// Location of Communities datastore - DataDirectory settings in [Server] overrides it if given
UserPath=./users


//--------------------------- Security ---------------------------------------//
[Security]
// Specifies the repositories/security modules enabled for document access control.
// Add the security type name (e.g. Autonomy, LDAP, NT) to activate it.
// Only listed types will be available for authenticating users and securing documents.
// enable the repositories you require for your data

// Path to the AES encryption keyfile used to decrypt stored security info
// (e.g. encrypted passwords in user profiles).
// Ensure this file is protected with OS-level file permissions.
SecurityInfoKeys=/community/cfg/aes.keyfile

// Defines which security type (by index) is used when none is explicitly specified.
// 0 = Autonomy (the first entry in the numbered list below, e.g. 0=Autonomy)
// Change this index if your primary security type is LDAP, NT, etc.
DefaultSecurityType=0

// Enables document-level security enforcement.
// TRUE  — IDOL filters query results based on the users security permissions,
//         ensuring users only see documents they are authorised to access.
// FALSE — No document-level filtering; all users can see all results (use only
//         in trusted/internal environments with no access control requirements).
DocumentSecurity=TRUE

// Controls which username is used when performing document security checks.
//
// FALSE (default):
//   Uses the username stored in the users Community profile database.
//   Useful when the login name differs from the profile/security identity
//   (e.g. SSO login as "john.smith" but profile stores "DOMAIN\jsmith").
//
// TRUE:
//   Uses the login username directly — the credential the user authenticated with.
//   Simpler and more predictable; avoids identity mismatches between
//   the login system and the Community profile store.
//   Recommended when login identity and security identity are the same.
SecurityUsernameDefaultToLoginUsername=FALSE

0=Autonomy
//1=Notes
//2=LDAP
//3=Documentum
//4=Exchange
//5=Netware
// NT support is only available on windows platforms
//6=NT

