// patching config file
// idol_ssl.cfg is written by run_idol.sh with SSL settings if required by IDOL_SSL env variable
// original.community.cfg is the config file as contained in the standard component zip

// modified config sections

< "idol_ssl.cfg" [SSLSettings]

[License] < "original.community.cfg" [License]
LicenseServerHost=licenseserver
SSLConfig=LicenseSSL

[LicenseSSL] < "idol.common.cfg" [LicenseSSL]

[Service] < "original.community.cfg" [Service]
Access-Control-Allow-Origin=*
SSLConfig=SSLSettings

[Server] < "original.community.cfg" [Server]
< "idol_ssl.cfg" [EnableSSL] SSLConfig

[AuthorizationRoles] < "original.community.cfg" [AuthorizationRoles]

[AdminRole] < "original.community.cfg" [AdminRole]
Clients=*

[QueryRole] < "original.community.cfg" [QueryRole]
Clients=*

[AgentDRE] < "original.community.cfg" [AgentDRE]
Host=idol-agentstore
ACIPort=9050
< "idol_ssl.cfg" [EnableSSL] SSLConfig

[DataDRE] < "original.community.cfg" [DataDRE]
Host=idol-content
ACIPort=9100
< "idol_ssl.cfg" [EnableSSL] SSLConfig

[Security] < "original.community.cfg" [Security]
SecurityInfoKeys=/community/cfg/aes.keyfile

[Logging] < "original.community.cfg" [Logging]
LogDirectory=/idol-logs
LogArchiveDirectory=/idol-logs/archive
LogEcho=TRUE

// unmodified config sections

[Paths] < "original.community.cfg" [Paths]
[Autonomy] < "original.community.cfg" [Autonomy]
[User] < "original.community.cfg" [User]
[Role] < "original.community.cfg" [Role]
[Agent] < "original.community.cfg" [Agent]
[Profile] < "original.community.cfg" [Profile]
[Community] < "original.community.cfg" [Community]
[ApplicationLogStream] < "original.community.cfg" [ApplicationLogStream]
[ActionLogStream] < "original.community.cfg" [ActionLogStream]
[TermLogStream] < "original.community.cfg" [TermLogStream]
[MailerLogStream] < "original.community.cfg" [MailerLogStream]
[UserLogStream] < "original.community.cfg" [UserLogStream]
