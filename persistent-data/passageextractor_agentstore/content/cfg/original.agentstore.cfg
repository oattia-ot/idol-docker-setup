[License]
LicenseServerHost=licenseserver
LicenseServerACIPort=20000
LicenseServerTimeout=60000
LicenseServerRetries=1
SSLConfig=LicenseSSL

[LicenseSSL]
SSLMethod=Negotiate
SSLCACertificate=/ssl/certs/ca-chain.cert.pem
SSLCheckCertificate=False

[Service]
ServicePort=12312
Access-Control-Allow-Origin=*

[Server]
IndexPort=12311
Port=12310

Threads=4
MaxInputString=1500000
MaxQueryTerms=100000

QUERYTHREADS=1
SplitNumbers=0
TermSize=20
DiskHash=5000000

AdvancedSearch=TRUE
AdvancedCaseSearch=TRUE
AgentBooleanCacheField=*/AGENTBOOL
// Used for queries with TextParse and FieldTextField (such as geoagentboolean lookups)
FieldTextCacheField=*/FTF
CombineIgnoreMissingValue=True
ParametricRefinement=True
ParametricNumericMapping=True

DateFormatCSVs=SHORTMONTH#SD+#SYYYY,DD/MM/YYYY,YYYY/MM/DD,YYYY-MM-DD,AUTNDATE
DEFAULTDOCUMENTFORMAT=IDX
IDXFIELDPREFIX=DOCUMENT
DOCUMENTDELIMITERCSVs=*/DOCUMENT

//--------------------------- Authorization Roles ----------------------------//
[AuthorizationRoles]
0=AdminRole
1=QueryRole
2=IndexRole

[AdminRole]
StandardRoles=admin,servicecontrol,query,servicestatus
Clients=*
//SSLIdentities=
//GSSPrincipals=

[QueryRole]
StandardRoles=query,servicestatus
Clients=*
//SSLIdentities=
//GSSPrincipals=

[IndexRole]
StandardRoles=index
Actions=getpid,getstatus,indexergetstatus
ServiceActions=getstatusinfo
Clients=*
//SSLIdentities=
//GSSPrincipals=

//--------------------------- Cache Settings ---------------------------------//
[IndexCache]
IndexCacheMaxSize=11000

//---------------------------Section breaking---------------------------------//
[SectionBreaking]
MinFieldLength=80000
MaxSectionLength=2000000

//--------------------------- Paths ------------------------------------------//
// This allows the database to be split across multiple partitions
[Paths]
// Set ArchivePath to archive all incoming index commands/data
//ArchivePath=./index/archive
DyntermPath=./index/dynterm
NodetablePath=./index/nodetable
RefIndexPath=./index/refindex
MainPath=./index/main
StatusPath=./index/status
TagPath=./index/tagindex
NumericPath=./index/numeric
SortfieldPath=./index/sortfield
StatePath=./index/storedstate
IndexQueuePath=./index/indexqueue
BitFieldPath=./index/bitfield
SecindexPath=./index/secindex
IndexTempPath=./index/indextmp

TemplateDirectory=./templates

//---------------------------Field Processing-------------------------------//
[FieldProcessing]
0=IndexFields
1=SectionBreakFields
2=DateFields
3=DatabaseFields
4=SetupReferenceFields
5=SourceFields
6=TitleFields
7=FieldCheckFields
8=AlwaysMatchFields
9=TextParseIndexFields
10=MatchFields
11=ParametricFields
12=NumericFields

[IndexFields]
// Controls which fields are indexed
Property=Index
PropertyFieldCSVs=*/DRECONTENT

[SectionBreakFields]
// Field containing document section number
Property=Section
PropertyFieldCSVs=*/DRESECTION

[DateFields]
// Fields containing the document date
Property=Date
PropertyFieldCSVs=*/DREDATE

[DatabaseFields]
// CSV of field names that defined the documents database
Property=Database
PropertyFieldCSVs=*/DREDBNAME

[SetupReferenceFields]
Property=ReferenceFields
PropertyFieldCSVs=*/DREREFERENCE

[SourceFields]
// SourceFields - used in suggest and for generating summaries
Property=Source
PropertyFieldCSVs=*/DRECONTENT

[TitleFields]
// Title Fields
Property=Title
PropertyFieldCSVs=*/DRETITLE

[FieldCheckFields]
// Used to combine results
Property=FieldCheck
PropertyFieldCSVs=*/CHECK

[AlwaysMatchFields]
// Used to ensure the AGENTBOOL field is always checked, regardless of the value of DRECONTENT
Property=AlwaysMatch
PropertyFieldCSVs=*/ALWAYSMATCH

[TextParseIndexFields]
// These fields are treated as index fields when Query is used with TextParse=True 
// and a percent-encoded doc as the input text.
// In practice, this is used for geoagentboolean lookups.
Property=TextParse
Propertyfieldcsvs=*/DRECONTENT,*/LAT,*/LON

[MatchFields]
Property=Match
PropertyFieldCSVs=*/DRETITLE

[ParametricFields]
Property=Parametric
PropertyFieldCSVs=*/PLACE_TYPE,*/PLACE_COUNTRY_CODE

[NumericFields]
Property=Numeric
PropertyFieldCSVs=*/PLACE_POPULATION

//---------------------------Properties-------------------------------//
[Index]
Index=TRUE

[Section]
SectionBreakType=TRUE

[Date]
DateType=TRUE

[Database]
DatabaseType=TRUE

[ReferenceFields]
ReferenceType=TRUE
TrimSpaces=TRUE

[Source]
SourceType=TRUE

[Title]
TitleType=TRUE

[FieldCheck]
FieldCheckType=TRUE

[AlwaysMatch]
AlwaysMatchType=true

[TextParse]
TextParseIndexType=true

[Match]
MatchType=True

[Parametric]
ParametricType=TRUE

[Numeric]
NumericType=TRUE

//---------------------------Databases-------------------------------//
[DATABASES]
NUMDBS=8
0=companies
1=people
2=places
3=teams
4=organizations
5=languages
6=elements
7=organisms

//---------------------------Logging-------------------------------//
[Logging]
LogArchiveDirectory=./logs/archive
LogDirectory=./logs
// These values apply to all streams, override on an individual basis
LogTime=TRUE
LogLevel=normal
LogExpireAction=compress
LogOldAction=move
LogMaxSizeKBs=20480

// Log streams
0=ApplicationLogStream
1=QueryLogStream
2=IndexLogStream
3=QueryTermsLogStream

[ApplicationLogStream]
LogFile=application.log
LogTypeCSVs=application

[QueryLogStream]
LogFile=query.log
LogTypeCSVs=query

[IndexLogStream]
LogFile=index.log
LogTypeCSVs=index

[QueryTermsLogStream]
LogFile=queryterms.log
LogTypeCSVs=queryterms

//---------------------------Language types-------------------------------//
[LanguageTypes]
DefaultLanguageType=englishUTF8
LanguageDirectory=./langfiles

0=english

[english]
Encodings=UTF8:englishUTF8
Stoplist=NONE
IndexNumbers=1
Propernames=0
SoftSeparators=&
HyphenChars=NONE
NgramOrientalOnly=true
AugmentSeparators=-'.’–‒—―
Stemming=false
TangibleCharacters=$

