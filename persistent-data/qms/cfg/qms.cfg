[License]
LicenseServerHost=licenseserver
LicenseServerACIPort=20000
LicenseServerTimeout=60000
LicenseServerRetries=1
SSLConfig=LicenseSSL

[LicenseSSL]
SSLMethod=Negotiate
SSLCACertificate=/ssl/certs/ca-chain.cert.pem
SSLVerifyClient=0

//--------------------------- Authorization Roles ----------------------------//
[AuthorizationRoles]
0=AdminRole
1=QueryRole
2=IndexRole

[AdminRole]
StandardRoles=admin,servicecontrol,query,servicestatus
Clients=*.*.*.*

[QueryRole]
StandardRoles=query,servicestatus
Clients=*.*.*.*

[IndexRole]
StandardRoles=index
Actions=getpid,getstatus,indexergetstatus
ServiceActions=getstatusinfo
Clients=*.*.*.*

[Service]
ServicePort=16002
useeventlog=false

[Server]
Port=16000
SSLPort=16000
SSLConfig=ServerSSL
SSLEnable=True
indexport=16001

[ServerSSL]
SSLMethod=Negotiate
SSLCertificate=/ssl/certs/idol-qms.cert.pem
SSLPrivateKey=/ssl/certs/idol-qms.key.pem
#SSLCACertificate=/ssl/certs/ca-chain.cert.pem
SSLVerifyClient=0

[IDOL]
Host=idol-passageextractor-content
Port=9103
SSLPort=9103
SSLConfig=BackendSSL

[PromotionAgentStore]
Host=idol-qms-agentstore
Port=20050
SSLPort=20050
SSLConfig=BackendSSL

[BackendSSL]
SSLMethod=Negotiate
SSLCACertificate=/ssl/certs/ca-chain.cert.pem
SSLVerifyClient=0

[Logging]
LogDirectory=./logs
LogTime=True
LogEcho=True
LogLevel=full
LogMaxSizeKBs=1024
OldLogFileAction=datestamp
0=applicationLogStream
1=actionLogStream

[applicationLogStream]
LogFile=app.log
LogTypeCSVs=application

[actionLogStream]
LogFile=action.log
LogTypeCSVs=query