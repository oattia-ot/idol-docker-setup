// patching config file
// idol_ssl.cfg is written by run_idol.sh with SSL settings if required by IDOL_SSL env variable
// original.category.cfg is the config file as contained in the standard component zip

// modified config sections

< "idol_ssl.cfg" [SSLSettings]

[License] < "original.qms.cfg" [License]
LicenseServerHost=licenseserver
SSLConfig=LicenseSSL

[LicenseSSL] < "idol.common.cfg" [LicenseSSL]

[Service] < "original.qms.cfg" [Service]
Access-Control-Allow-Origin=*
SSLConfig=SSLSettings

[Server] < "original.qms.cfg" [Server]
< "idol_ssl.cfg" [EnableSSL] SSLConfig

//--------------------------- Authorization Roles ----------------------------//
[AuthorizationRoles]
0=AdminRole
1=QueryRole
2=IndexRole

[AdminRole]
StandardRoles=admin,servicecontrol,query,servicestatus
Clients=*

[QueryRole]
StandardRoles=query,servicestatus
Clients=*

[IndexRole]
StandardRoles=index
Actions=getpid,getstatus,indexergetstatus
ServiceActions=getstatusinfo
Clients=*

[IDOL]
Host=idol-passageextractor-content
Port=9103
SSLPort=9103
SSLConfig=BackendSSL

[PromotionAgentStore]
Host=idol-qms-agentstore
Port=20050
SSLPort=20050
SSLConfig=BackendSSL

[BackendSSL]
SSLMethod=Negotiate
SSLCACertificate=/ssl/certs/ca-chain.cert.pem
SSLVerifyClient=0

[Logging]
LogDirectory=./logs
LogTime=True
LogEcho=True
LogLevel=full
LogMaxSizeKBs=1024
OldLogFileAction=datestamp
0=applicationLogStream
1=actionLogStream

[applicationLogStream]
LogFile=app.log
LogTypeCSVs=application

[actionLogStream]
LogFile=action.log
LogTypeCSVs=query