// patching config file
// idol_ssl.cfg is written by run_idol.sh with SSL settings if required by IDOL_SSL env variable
// original.category.cfg is the config file as contained in the standard component zip

// modified config sections

< "idol_ssl.cfg" [SSLSettings]

[License] < "original.category.cfg" [License]
LicenseServerHost=licenseserver
SSLConfig=LicenseSSL

[LicenseSSL] < "idol.common.cfg" [LicenseSSL]

[Service] < "original.category.cfg" [Service]
Access-Control-Allow-Origin=*
SSLConfig=SSLSettings

[Server] < "original.category.cfg" [Server]
< "idol_ssl.cfg" [EnableSSL] SSLConfig

[AuthorizationRoles] < "original.category.cfg" [AuthorizationRoles]

[AdminRole] < "original.category.cfg" [AdminRole]
Clients=*

[QueryRole] < "original.category.cfg" [QueryRole]
Clients=*

[DataDre] < "original.category.cfg" [DataDre]
host=idol-content
aciport=9100
< "idol_ssl.cfg" [EnableSSL] SSLConfig

[CatDRE] < "original.category.cfg" [CatDRE]
host=idol-agentstore
aciport=9050
< "idol_ssl.cfg" [EnableSSL] SSLConfig

[CommunityServer] < "original.category.cfg" [CommunityServer]
host=idol-community
port=9030
< "idol_ssl.cfg" [EnableSSL] SSLConfig

[Logging] < "original.category.cfg" [Logging]
LogDirectory=/idol-logs
LogArchiveDirectory=/idol-logs/archive
LogEcho=TRUE
// original.category.cfg logging settings
// unmodified config sections

[Paths] < "original.category.cfg" [Paths]
[Cluster] < "original.category.cfg" [Cluster]
[Taxonomy] < "original.category.cfg" [Taxonomy]
[AnalysisSchedules] < "original.category.cfg" [AnalysisSchedules]
[AnalysisSchedule0] < "original.category.cfg" [AnalysisSchedule0]
[AnalysisSchedule1] < "original.category.cfg" [AnalysisSchedule1]
[AnalysisSchedule2] < "original.category.cfg" [AnalysisSchedule2]
[AnalysisSchedule3] < "original.category.cfg" [AnalysisSchedule3]
[AnalysisSchedule4] < "original.category.cfg" [AnalysisSchedule4]
[ApplicationLogStream] < "original.category.cfg" [ApplicationLogStream]
[CategoryLogStream] < "original.category.cfg" [CategoryLogStream]
[ClusterLogStream] < "original.category.cfg" [ClusterLogStream]
[TaxonomyLogStream] < "original.category.cfg" [TaxonomyLogStream]
[ScheduleLogStream] < "original.category.cfg" [ScheduleLogStream]
[LanguageTypes] < "original.category.cfg" [LanguageTypes]
