< "/answerserver/cfg/idol_ssl.cfg" [SSLSettings]  

[License]
LicenseServerHost=LICENSESERVER-FQDN-PLACEHOLDER
LicenseServerACIPort=20000
LicenseServerTimeout=60000
LicenseServerRetries=1
SSLConfig=LicenseSSL

[LicenseSSL]
SSLMethod=Negotiate
SSLCACertificate=/ssl/certs/ca-chain.cert.pem
SSLVerifyClient=0

[Service]
ServicePort=DA_ANSWER_SERVER_SRV_PLACEHOLDER
SSLConfig=SSLSettings 
Access-Control-Allow-Origin=*

[Server]
Port=DA_ANSWER_SERVER_ACI_PLACEHOLDER
IndexPort=DA_ANSWER_BANK_AGENTSTORE_IDX_PLACEHOLDER
< "/answerserver/cfg/idol_ssl.cfg" [EnableSSL] SSLConfig
Threads=4
MaxInputString=64000
LogRequestTiming=TRUE

[AuthorizationRoles]
0=AdminRole
1=QueryRole

[AdminRole]
StandardRoles=admin,servicecontrol,query,servicestatus
Clients=*.*.*.*

[QueryRole]
StandardRoles=query,servicestatus
Clients=*.*.*.*

[Systems]
// Numbered list of config sections configuring an answer system
0=AnswerBank
1=RAG
2=Conversation
3=KDChat
//4=Grok
//5=FactBank


[AnswerBank]
Type=answerbank
IdolHost=idol-answerbank-agentstore
IdolAciPort=DA_ANSWER_BANK_AGENTSTORE_ACI_PLACEHOLDER
IdolSslConfig=SSLSettings

[FactBank]
Type=factbank
backendtype=sqldb
connectionstring=Driver={PostgreSQL};Server=idol-factbank-postgres;Port=5432;Database=factbank-data;Uid=postgres;password=password
eductionquestiongrammars=./resources/grammars/question_grammar_en.ecr
eductionluascript=./resources/lua/question_grammar_en.lua
eductiontimegrammars=./resources/grammars/datetime_processing.ecr
timeluascript=./resources/lua/datetime.lua
CodifierType=odbc
CodingsConfigSection=FactBank

[PassageExtractor]
Type=passageextractor
IdolHost=idol-passageextractor-content
IdolAciPort=DA_PASSAGEEXTRATOR_CONTENT_ACI_PLACEHOLDER
AgentstoreHost=idol-passageextractor-agentstore
AgentstoreAciPort=DA_PASSAGEEXTRATOR_AGENTSTORE_ACI_PLACEHOLDER
SSLConfig=BackendSSL
IdolSslConfig=BackendSSL
AgentstoreSSLConfig=BackendSSL
EductionGrammars=./resources/grammars/question_grammar_en.ecr,./passageextractor/eduction/number_en.ecr,./passageextractor/eduction/person_en.ecr,./passageextractor/eduction/date_en.ecr,./passageextractor/eduction/money_en.ecr
ClassifierFile=./passageextractor/classifiertraining/svm_en.dat
LabelFile=./passageextractor/classifiertraining/labels_en.dat
EntityExtractionFile=./passageextractor/configuration/entity_extraction_en.json
SurfacePatternsFile=./passageextractor/configuration/surface_patterns_en.json
ClassifierBehaviorFile=./passageextractor/configuration/classifier_behavior.json

[Logging]
LogArchiveDirectory=./logs/archive
LogDirectory=./logs
LogTime=TRUE
LogOutputLogLevel=TRUE
// Controls the verbosity of Answer Servers log output.
// Affects what gets written to the log files — balance between
// visibility and log file size/noise.
//
// Options (least → most verbose):
//   "off"     → no logging at all
//   "fatal"   → only unrecoverable crashes
//   "error"   → errors that affect functionality
//   "warning" → non-fatal issues worth investigating
//   "normal"  → standard operational messages (current) ← recommended for production
//   "debug"   → detailed internal state, useful for troubleshooting
//   "full"    → everything, including raw ACI requests/responses ← very noisy
//
// Tip: use "normal" in production, switch to "debug" or "full"
// temporarily when diagnosing retrieval or LLM prompt issues,
// then revert — "full" can generate gigabytes of logs quickly.
LogLevel=normal
LogEcho=TRUE
// Log streams
0=ApplicationLogStream
1=ActionLogStream
2=FactBankLogStream
3=AnswerBankLogStream
4=PassageExtractorLogStream

[ApplicationLogStream]
LogFile=application.log
LogTypeCSVs=application

[ActionLogStream]
LogFile=action.log
LogTypeCSVs=action

[FactBankLogStream]
LogFile=factbank.log
LogTypeCSVs=factbank

[AnswerBankLogStream]
LogFile=answerbank.log
LogTypeCSVs=answerbank

[PassageExtractorLogStream]
LogFile=passageextractor.log
LogTypeCSVs=passageextractor

// ═══════════════════════════════════════════════════════════════════
// KDChat & Conversation Section
// ═══════════════════════════════════════════════════════════════════
[Conversation]
Type=Conversation
TaskConfigurationFile=conversation/longmemory/long_config.json
SessionExpirationInterval=360000
SessionExpirationIdleTime=360000

[KDChat]
Type=Conversation
TaskConfigurationFile=conversation/kdchat/kdchat_config.json
SessionExpirationInterval=360000
SessionExpirationIdleTime=360000

// ═══════════════════════════════════════════════════════════════════
// Grok Section
// ═══════════════════════════════════════════════════════════════════
[Grok]
Type=RAG
IDOLHost=idol-passageextractor-content
IDOLACIPort=DA_PASSAGEEXTRATOR_CONTENT_ACI_PLACEHOLDER
IdolSslConfig=BackendSSL
ModuleID=GrokModule
RetrievalType=conceptual
PromptTemplatePath=./rag/prompt_template.txt
PromptTokenLimit=10000
MaxQuestionSize=100
ACIMaxResults=5
CandidateRetrievalDefaults=CandidateRetrievalParams

[CandidateRetrievalParams]
//DatabaseMatch=Grok
ActionID=DemoUser
Summary=Context

[GrokModule]
Type=GenerativePython
Script=./rag/grok/grok4.py



// ═══════════════════════════════════════════════════════════════════
// RAG Section - Retrieval-Augmented Generation: 
//     retrieves relevant from IDOL Content, 
//       then feeds them as context to an LLM to generate answers.
// ═══════════════════════════════════════════════════════════════════
[RAG]

// Identifies this section as a RAG system to Answer Server.
// Other valid types: FactBank, PassageExtractor, PassageExtractorLLM
Type=RAG

// ─── Data Store Connection ───────────────────────────────────────
// Hostname of the IDOL Content component that holds the indexed documents.
// Answer Server queries this component to retrieve candidate passages.
IdolHost=idol-passageextractor-content

// ACI port of the IDOL Content component.
// Written as a placeholder — substituted at deploy time
// (e.g. by Docker environment variables or a NiFi parameter context).
IdolAciPort=DA_PASSAGEEXTRATOR_CONTENT_ACI_PLACEHOLDER

// References a [BackendSSL] section defined elsewhere in the config.
// Enforces TLS encryption on all communication between
// Answer Server and the IDOL Content component.
IdolSslConfig=BackendSSL

// ─── LLM Module ──────────────────────────────────────────────────
// Points to the [RAGLLMModule] section (defined elsewhere).
// That section specifies the Python or Lua script that connects
// to your LLM (e.g. Mistral via Ollama, OpenAI API, etc.)
// and defines the get_token_count() and generate() functions
// that Answer Server calls during prompt construction and generation.
ModuleID=RAGLLMModule

// ─── Retrieval Control ───────────────────────────────────────────
// Maximum number of candidate passages Answer Server fetches from
// IDOL Content to use as LLM context.
// Higher = richer context but more tokens consumed from PromptTokenLimit.
// Lower = faster but LLM may lack sufficient context to answer well.
//
//   ACIMaxResults=1  → minimal context, fast, good for factual Q&A
//   ACIMaxResults=3  → balanced (current)
//   ACIMaxResults=10 → rich context, risks hitting PromptTokenLimit
ACIMaxResults=3

// RetrievalType controls how Answer Server queries IDOL Content
// for candidate passages. Only applies when IdolHost/IdolAciPort
// point directly to a Content component (not QMS).
// If pointing to QMS, use CandidateRetrievalDefaults + QMS QueryType instead.
//
// Options:
// - "conceptual": Sends a conceptual/semantic query to the Content component —
//                 IDOLs classic natural-language understanding approach using
//                 statistical concept matching. No embeddings required.
//
// - "vector":     Sends a vector/embedding search only — Answer Server generates
//                 embeddings for the question and retrieves by nearest-vector
//                 similarity. Requires documents to have embeddings indexed.
//
// - "mixed":      Sends BOTH a conceptual query and a vector search in parallel,
//                 then combines the results — hybrid mode gives the best recall.
//                 Requires embeddings to be indexed in the Content component.
//                 This is the recommended default for production RAG setups.
RetrievalType=mixed

// ─── Prompt Construction ─────────────────────────────────────────
// Path to the text file that defines the prompt structure sent to the LLM.
// The template typically contains placeholders like {context} and {question}
// that Answer Server substitutes before calling the LLM script. Example:
//
//   Answer the question using only the context provided below.
//   Context: {context}
//   Question: {question}
//   Answer:
//
// Edit this file to tune LLM behaviour, tone, or response format
// without touching the Answer Server config.
PromptTemplatePath=./rag/prompt_template.txt

// Hard ceiling on the TOTAL tokens sent to the LLM in one prompt.
// Answer Server enforces this by calling get_token_count() from your
// LLM script and truncating the retrieved context passages if needed.
//
// The full prompt budget is shared between three parts:
//   PromptTokenLimit (3000)
//   ├── Template overhead   (~100–200)  static text in prompt_template.txt
//   ├── User question       (≤ 70)      enforced by MaxQuestionSize below
//   └── Retrieved passages  (remainder) truncated to fit within the limit
//
// IMPORTANT — must satisfy: PromptTokenLimit + expected_answer_tokens ≤ num_ctx
//   Mistral-7B architectural max:  32,768 tokens (num_ctx)
//   Reserve for generated answer:  ~500  tokens
//   Safe PromptTokenLimit ceiling: ~32,268 tokens
//   This config uses 3,000 → very conservative, trades context
//   richness for speed and predictability.
//
// Mistral-7B limit is 32K tokens:
// - Set no more than 10K.
PromptTokenLimit=3000

// Maximum tokens the users question is allowed to consume.
// If the question exceeds this, Answer Server rejects it before
// even querying IDOL Content — protects the rest of the token budget.
//
// OpenAI rule of thumb: 75 words ≈ 100 tokens
//   → 70 tokens ≈ ~52 words — enough for one focused question.
//   → Increase if users are expected to ask multi-sentence questions.
//
// OpenAI rule of thumb 75 words ~ 100 tokens:
// - set to 50 words ~ 67 tokens for single questions
MaxQuestionSize=70

// References the [RAGRetrievalParams] section below.
// Applies those settings as defaults when querying IDOL Content
// for candidate passages. Acts as a quality gate before passages
// are passed to the LLM — low-relevance content is filtered out here.
CandidateRetrievalDefaults=RAGRetrievalParams


// ═══════════════════════════════════════════════════════════════════
// RETRIEVAL QUALITY FILTER
// Applied when Answer Server queries IDOL Content for passages.
// Passages that do not meet these criteria are discarded before
// they ever reach the prompt — keeping LLM context clean and relevant.
// ═══════════════════════════════════════════════════════════════════
[RAGRetrievalParams]

// Minimum IDOL relevance score (0–100) a passage must achieve
// to be included in the LLM prompt context.
// Passages scoring below this threshold are silently discarded.
//
//   Score < 20  → weakly related, likely noise → discarded ❌
//   Score ≥ 20  → sufficiently relevant         → sent to LLM ✅
//
// Tuning guide:
//   Too low  (e.g. 5)  → noise pollutes the prompt → LLM hallucinates
//   Too high (e.g. 80) → too few passages pass → LLM says "I don't know"
//   Sweet spot: 15–30 for general RAG workloads
MinScore=20

[RAGLLMModule]
Type=GenerativePython
Script=./rag/ollama_server.py
RequirementsFile=./rag/requirements.txt
OllamaHost=http://ollama:11434
OllamaModel=LLM-MODEL-SELECTION-PLACEHOLDER 

[BackendSSL]
SSLMethod=Negotiate
SSLCACertificate=/ssl/certs/ca-chain.cert.pem
SSLVerifyClient=0
