[EnableSSL]
SSLConfig=SSLSettings
IdolSslConfig=SSLSettings
AgentstoreSslConfig=SSLSettings

[SSLSettings]
SSLMethod=Negotiate
SSLCertificate=/ssl/certs/idol-dataadmin-community-fullchain.cert.pem
SSLPrivateKey=/ssl/certs/idol-dataadmin-community.key.pem
SSLCACertificate=/ssl/certs/ca-chain.cert.pem