// patching config file
// idol_ssl.cfg is written by run_idol.sh with SSL settings if required by IDOL_SSL env variable
// original.agentstore.cfg is the config file as contained in the standard component zip

// modified config sections

< "idol_ssl.cfg" [SSLSettings]

[License] < "original.agentstore.cfg" [License]
LicenseServerHost=LICENSESERVER-FQDN-PLACEHOLDER
LicenseServerACIPort=20000
SSLConfig=LicenseSSL

[LicenseSSL] < "idol.common.cfg" [LicenseSSL]

[Service] < "original.agentstore.cfg" [Service]
Access-Control-Allow-Origin=*
SSLConfig=SSLSettings

[Server] < "original.agentstore.cfg" [Server]
< "idol_ssl.cfg" [EnableSSL] SSLConfig

[IndexServer] < "original.agentstore.cfg" [IndexServer]
< "idol_ssl.cfg" [EnableSSL] SSLConfig

[AuthorizationRoles] < "original.agentstore.cfg" [AuthorizationRoles]

[AdminRole] < "original.agentstore.cfg" [AdminRole]
Clients=*

[QueryRole] < "original.agentstore.cfg" [QueryRole]
Clients=*

[IndexRole] < "original.agentstore.cfg" [IndexRole]
Clients=*

[Logging] < "original.agentstore.cfg" [Logging]
LogDirectory=/idol-logs
LogArchiveDirectory=/idol-logs/archive
LogEcho=TRUE
