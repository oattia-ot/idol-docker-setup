[License]
LicenseServerHost=licenseserver
LicenseServerACIPort=20000
LicenseServerTimeout=60000
LicenseServerRetries=1

[Service]
ServicePort=12202
Access-Control-Allow-Origin=*

[Server]
Port=12200
IndexPort=12201

Threads=4
MaxInputString=64000
LogRequestTiming=TRUE

AdvancedSearch=TRUE

MaxResults=10000000
MaxQueryTerms=250
//QueryTimeoutInMilliseconds=30000


AutnRank=TRUE

AutoDetectLanguagesAtIndex=FALSE
DisallowAgentWeights=TRUE
// De-duplicate documents by the following fields e.g. */DREREFERENCE
KillDuplicates=*/DREREFERENCE

// CSV of tags that define the start / end of an XML document
DocumentDelimiterCSVs=*/DOCUMENT

// When exporting to XML, create the top level field
XMLTopLevelExportField=DOCUMENTS

DateFormatCSVs=SHORTMONTH#SD+#SYYYY,DD/MM/YYYY,YYYY/MM/DD,YYYY-MM-DD,YYYYMMDDTHHNNSS,AUTNDATE

ParametricRefinement=TRUE
// Reduces memory required for parametric refinement at expense of a=GetTagValues&Restriction=... - use a=getQueryTagValues instead
ParametricMaxPairsPerDocument=0
// Optimises MATCH operations on Parametric fields - don't need to make them MatchType as well
ParametricNumericMapping=TRUE

SplitNumbers=FALSE

// Include result documents that do not have the specified sort field, but always at the bottom
SortReturnAllDocuments=TRUE
SortMissingValueAtEnd=TRUE

// The following will help prevent performance degradation when end users use burdensome wildcards like "s*" or "*s*"
WildcardMaxTerms=1000

// These fields will be preserved through a document update
KillDuplicatesPreserveFields=*/AU_TAG_*,*/PHRASE_WEIGHT

// The following control the quality of the query summary results at a slight cost to performance.  They may be altered depending on data corpuses and desired results
QuerySummaryPlus=TRUE
QuerySummaryAdvanced=TRUE
QuerySummaryLength=25
QuerySummaryTerms=350

// Don't currently expect massive bulk loading 
DelayedSync=true
maxSyncDelay=2

NodeTableCompression=lz4

AgentBooleanCacheField=*/RULE
FieldTextCacheField=*/RULE_FIELDTEXT

// Can only cache one set of fields - choose whichever is more common
//AgentBooleanCacheField=*/BOOLEANRESTRICTION
//FieldTextCacheField=*/FIELDTEXTRESTRICTION

UnstemmedMinDocOccs=1

//--------------------------- Authorization Roles ----------------------------//
[AuthorizationRoles]
0=AdminRole
1=QueryRole
2=IndexRole

[AdminRole]
StandardRoles=admin,servicecontrol,query,servicestatus
Clients=localhost
//SSLIdentities=
//GSSPrincipals=

[QueryRole]
StandardRoles=query,servicestatus
Clients=localhost
//SSLIdentities=
//GSSPrincipals=

[IndexRole]
StandardRoles=index
Actions=getpid,getstatus,indexergetstatus
ServiceActions=getstatusinfo
Clients=localhost
//SSLIdentities=
//GSSPrincipals=

//--------------------------- Cache Settings ---------------------------------//
[IndexCache]
IndexCacheMaxSize=102400

//--------------------------- Paths ------------------------------------------//
// This allows the database to be split across multiple partitions
[Paths]
// Set ArchivePath to archive all incoming index commands/data
//ArchivePath=./index/archive
DyntermPath=./index/dynterm
NodetablePath=./index/nodetable
RefIndexPath=./index/refindex
MainPath=./index/main
StatusPath=./index/status
TagPath=./index/tagindex
NumericPath=./index/numeric
SortfieldPath=./index/sortfield
StatePath=./index/storedstate
IndexQueuePath=./index/indexqueue
BitFieldPath=./index/bitfield
SecindexPath=./index/secindex
IndexTempPath=./index/indextmp

TemplateDirectory=./templates

//--------------------------- Field Processing -------------------------------//
[FieldProcessing]
0=SetReferenceFields
1=SetDateFields
2=SetDatabaseFields
3=SetIndexFields
4=SetNumericDateFields
5=SetMatchFields
6=SetExpireDateFields
7=SetNumericFields
8=SetSortFields

[SetReferenceFields]
Property=ReferenceFields
PropertyFieldCSVs=*/DREREFERENCE,*/REFERENCE

[SetDateFields]
Property=DateFields
PropertyFieldCSVs=*/CREATED_TIME

[SetDatabaseFields]
Property=DatabaseFields
PropertyFieldCSVs=*/DREDBNAME

[SetIndexFields]
Property=IndexFields
PropertyFieldCSVs=*/DRECONTENT,*/DRETITLE,*/ANSWER,*/PROCESSED_TEXT,*/ORIGINAL_RULE,*/TRAINING

[SetNumericDateFields]
Property=NumericDateFields
PropertyFieldCSVs=*/CREATED_TIME,*/LAST_MODIFIED_TIME

[SetMatchFields]
Property=MatchFields
PropertyFieldCSVs=*/ANSWER_ID,*/SAMPLE_QUESTION,*/STATE,*/DELETED,*/QUESTION_EQUIVALENCE_CLASS_ID,*/SYNONYM_REFERENCE,*/QMSTYPE,*/FIELD_CRITERIA_DATABASEMATCH,*/QMS_SCOPE_RULE

[SetExpireDateFields]
Property=ExpireDateFields
PropertyFieldCSVs=*/EXPIRE_DATE

[SetNumericFields]
Property=NumericFields
PropertyFieldCSVs=*/POPULARITY_COUNT,*/ANSWER_LIKELIHOOD,*/INCONGRUOUS_QUESTIONS_COUNT

[SetSortFields]
Property=SortFields
PropertyFieldCSVs=*/QMSVALUE2

//--------------------------- Properties -------------------------------------//

[IndexFields]
Index=TRUE
TextParseIndexType=TRUE

[DateFields]
DateType=TRUE

[DatabaseFields]
DatabaseType=TRUE

[ReferenceFields]
ReferenceType=TRUE
TrimSpaces=TRUE

[NumericDateFields]
NumericDateType=TRUE

[MatchFields]
MatchType=TRUE

[ExpireDateFields]
ExpireDateType=TRUE
NumericDateType=TRUE

[NumericFields]
NumericType=TRUE

[SortFields]
SortType=TRUE

//--------------------------- Logging ----------------------------------------//
[Logging]
LogArchiveDirectory=./logs/archive
LogDirectory=./logs
// These values apply to all streams, override on an individual basis
LogTime=TRUE
LogLevel=normal
LogExpireAction=compress
LogOldAction=move
LogMaxSizeKBs=20480

// Log streams
0=ApplicationLogStream
1=QueryLogStream
2=IndexLogStream
3=QueryTermsLogStream

[ApplicationLogStream]
LogFile=application.log
LogTypeCSVs=application

[QueryLogStream]
LogFile=query.log
LogTypeCSVs=query

[IndexLogStream]
LogFile=index.log
LogTypeCSVs=index

[QueryTermsLogStream]
LogFile=queryterms.log
LogTypeCSVs=queryterms

//--------------------------- Language Types ---------------------------------//
[LanguageTypes]
GenericTransliteration=TRUE
DefaultLanguageType=englishUTF8
DefaultEncoding=UTF8
LanguageDirectory=./langfiles
IndexNumbers=1
HyphenChars=NONE
AugmentSeparators=-
ProperNames=7

0=english

[english]
Encodings=UTF8:englishUTF8
Stoplist=english.answerbank.dat

//--------------------------- Databases --------------------------------------//
[Databases]
NumDBs=4

[Database0]
Name=questions

[Database1]
Name=questionclasses

[Database2]
Name=answers

[Database3]
Name=Activated
Internal=TRUE

[Schedule]
Expire=TRUE
ExpireInterval=01:00
